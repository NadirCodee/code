<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color generator</title>
</head>
<body>
    <div class="container">
        <h1 class="title">Color Palette Generator</h1>
        <button class="generator-btn"><i class="fa-solid fa-arrows-rotate"></i>
            Generate Palette
        </button>
        <div class="color-card">
            <div class="card">
                <div class="color" style="background-color: #E8336F;"></div>
                <button>#E8336F
                    <i class="fa-solid fa-copy"></i>
                </button>
            </div>
            <div class="card">
                <div class="color" style="background-color: #4F50B1;"></div>
                <button>#4F50B1
                    <i class="fa-solid fa-copy"></i>
                </button>
            </div>
            <div class="card">
                <div class="color" style="background-color: #F9792C;"></div>
                <button>#F9792C
                    <i class="fa-solid fa-copy"></i>
                </button>
            </div>
            <div class="card">
                <div class="color" style="background-color: #80CAB8;"></div>
                <button>#80CAB8
                    <i class="fa-solid fa-copy"></i>
                </button>
            </div>
            <div class="card">
                <div class="color" style="background-color: #9578FE;"></div>
                <button>#9578FE
                    <i class="fa-solid fa-copy"></i>
                </button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
