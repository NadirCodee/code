<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign up page</title>
</head>
<body>
  <div class="container">
    <h1 class="title">Sign up</h1>
    <form action="">
      <p class="intro">Let's get started with your 30 days trial</p>
      <div class="input-box">
        <input type="email" placeholder="Email">
      </div>
      <div class="input-box">
        <input type="password" placeholder="Password">
        <button class="eye"><i class="fa-regular fa-eye-slash"></i></button>
      </div>
      <a href="#" class="link">Recovery Password</a>
      <button type="submit" class="submit-btn">Sign up</button>
    </form>
    <p class="divider">Or continue with</p>
    <div class="social-icons">
      <a href="#" style="color: #ff6a00;"><i class="fa-brands fa-google"></i></a>
      <a href="#" style="color: #000;"><i class="fa-brands fa-apple"></i></a>
      <a href="#" style="color: #0077ff;"><i class="fa-brands fa-facebook"></i></a>
    </div>
  </div>
</body>
</html>
