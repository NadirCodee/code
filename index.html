<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in with your website</title>
</head>

<body>
  <div class="container">
    <h1>Login to <span>Your website</span></h1>
    <form action="">
      <div class="input-box">
        <input type="email" required name="email" id="email">
        <label for="email">Email or Username</label>
      </div>
      <div class="input-box">
        <input type="password" required name="password" id="password">
        <label for="password">Password</label>
      </div>
      <a href="#" class="forgot">I forgot my password</a>
      <button type="submit" class="submit-btn">Log in</button>
    </form>
    <h2>Login with another account</h2>
    <div class="links">
      <a href="#" class="linkedin"><i class="fa-brands fa-linkedin"></i></a>
      <a href="#" class="google"><i class="fa-brands fa-google"></i></a>
      <a href="#" class="facebook"><i class="fa-brands fa-facebook"></i></a>
      <a href="#" class="github"><i class="fa-brands fa-github"></i></a>
      <a href="#" class="twitter"><i class="fa-brands fa-twitter"></i></a>
    </div>
    <a href="#" class="last-link">Not a member yet? <span>Sign up for free</span></a>
  </div>
</body>

</html>
