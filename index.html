<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Webite</title>
</head>
<body>
    <div class="card">
        <div class="profile">
            <img src="https://heroshotphotography.com/wp-content/uploads/2023/03/male-linkedin-corporate-headshot-on-white-square-1024x1024.jpg" 
            alt="profile picture" title="profile pictute" width="200">
        </div>
        <h1 class="name">Your name</h1>
        <p class="skills">Coder & YouTuber</p>
        <div class="platforms">
            <a href="#" class="facebook"><i class="fa-brands fa-facebook"></i></a>
            <a href="#" class="twitter"><i class="fa-brands fa-twitter"></i></a>
            <a href="#" class="instagram"><i class="fa-brands fa-instagram"></i></a>
            <a href="#" class="youtube"><i class="fa-brands fa-youtube"></i></a>
        </div>
        <div class="contact">
            <a href="#">Subscribe</a>
            <a href="#">Message</a>
        </div>
        <div class="interaction">
            <div class="number">
                <i class="fa-regular fa-heart"></i>
                60k
            </div>
            <div class="number">
                <i class="fa-regular fa-comment"></i>
                20k
            </div>
            <div class="number">
                <i class="fa-solid fa-share"></i>
                12k
            </div>
        </div>
    </div>
</body>
</html>
