<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css">
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make an account</title>
</head>
<body>
    <form>
        <button class="cancel-btn"><i class="fa-solid fa-x"></i></button>
        <h1 class="title">Registration Form</h1>
        <div class="input-container">
            <div class="input-box">
                <input type="text" name="name" title="Your name" placeholder="Name">
            </div>
            <div class="input-box">
                <input type="email" name="email" title="Your Email address" required placeholder="Email address">
            </div>
            <div class="input-box">
                <input type="text" name="country" title="Your country" required placeholder="Country">
            </div>
            <div class="input-box">
                <input type="tel" name="phone-number" title="Your Phone number" required placeholder="Phone">
            </div>
            <div class="input-box">
                <input type="password" name="password" title="Your password" placeholder="Password">
            </div>
        </div>
        <label for="checkbox" class="checkbox">
            <input type="checkbox" id="checkbox" name="remember">
            <span>Remember me.</span>
        </label>
        <button class="create-btn" type="submit">create account</button>
        <p class="last-line">Already have an account?<a href="#">Sign in</a></p>
    </form>
</body>
</html>
